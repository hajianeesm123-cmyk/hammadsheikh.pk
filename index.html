
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammad Sheikh bin Nadeem | Founder & Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505; /* Pure Black */
        }
        h1, h2, h3, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glass-card {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-float {
            animation: float 8s ease-in-out infinite;
        }
        .text-gradient {
            background: linear-gradient(to right, #ff007f, #00d4ff, #5c3d2e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-pink {
            box-shadow: 0 0 50px -10px rgba(255, 0, 127, 0.4);
        }
        .glow-blue {
            box-shadow: 0 0 50px -10px rgba(0, 212, 255, 0.4);
        }
        .chocolate-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 212, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(92, 61, 46, 0.1) 0px, transparent 50%);
        }
        ::-webkit-scrollbar {
          width: 10px;
        }
        ::-webkit-scrollbar-track {
          background: #050505;
        }
        ::-webkit-scrollbar-thumb {
          background: #5c3d2e;
          border-radius: 20px;
          border: 3px solid #050505;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-[#050505] text-white chocolate-mesh overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
